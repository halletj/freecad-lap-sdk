# Maps FreeCAD API classes to domain .lap files via glob patterns.
# Classes not matching any pattern go to freecad-misc.lap.
# Order matters: first match wins.

core:
  - Application
  - Document
  - Document*
  - DocumentObject
  - DocumentObject*
  - GeoFeature
  - PropertyContainer
  - ExtensionContainer
  - TransactionalObject
  - "*Property*"
  - Vector
  - Vector*
  - Matrix
  - Matrix*
  - Placement
  - Placement*
  - Rotation
  - Rotation*
  - Axis
  - BoundBox
  - BoundBox*
  - Console
  - Units
  - Unit*
  - Quantity
  - Base
  - Persistence
  - Origin
  - "Parameter*"
  - Expression*
  - Color
  - Guid*

